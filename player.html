<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Never gonna give you up</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="player.css" />
</head>
<body>
  <header class="top">
    <span>
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      joseph@portfolio: <span class="path" id="path">~/rickroll</span>
    </span>
    <span id="note">you were warned</span>
  </header>

  <main class="stage">
    <h1 class="sr-only">Never Gonna Give You Up, embedded video player</h1>
    <div class="frame">
      <div id="player"></div>
      <div class="fallback" id="fallback" hidden>
        <p id="fallback-msg">The embed was blocked, so autoplay can't start here.</p>
        <p><a id="yt-link" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">Open it on YouTube instead</a></p>
      </div>
    </div>
  </main>

  <footer class="bottom">
    <span><kbd>Esc</kbd> or the link to escape</span>
    <a href="index.html#terminal">&larr; back to the terminal</a>
  </footer>

  <p class="sound" id="sound" role="button" tabindex="0" hidden>tap anywhere for sound</p>

  <script>
  (function () {
    /* ?v=<video id>&name=<path label>&note=<top-right text>&title=<tab title>&t=<start seconds> */
    var params = new URLSearchParams(window.location.search);
    var VIDEO = /^[A-Za-z0-9_-]{11}$/.test(params.get('v') || '') ? params.get('v') : 'dQw4w9WgXcQ';
    var NAME = (params.get('name') || 'rickroll').slice(0, 40);
    var NOTE = (params.get('note') || 'you were warned').slice(0, 40);
    var TITLE = (params.get('title') || 'Never gonna give you up').slice(0, 80);
    var START = parseInt(params.get('t') || params.get('start') || '0', 10);
    if (!isFinite(START) || START < 0) START = 0;

    document.title = TITLE;
    document.getElementById('path').textContent = '~/' + NAME;
    document.getElementById('note').textContent = NOTE;
    document.getElementById('yt-link').href = 'https://www.youtube.com/watch?v=' + VIDEO + (START ? '&t=' + START + 's' : '');

    var player = null;
    var unmuted = false;
    var sound = document.getElementById('sound');
    var fallback = document.getElementById('fallback');
    var tries = 0;

    /* Muted autoplay is always allowed, so start there and try to unmute. */
    function attemptUnmute() {
      if (!player || typeof player.unMute !== 'function') return;
      try {
        player.setVolume(100);
        player.unMute();
      } catch (e) { /* older embed API */ }
      window.setTimeout(function () {
        var stillMuted = false;
        try { stillMuted = player.isMuted(); } catch (e) {}
        if (stillMuted && tries < 4) {
          tries += 1;
          sound.hidden = false;               // ask for the gesture the browser wants
        } else {
          unmuted = true;
          sound.hidden = true;
        }
      }, 300);
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        videoId: VIDEO,
        playerVars: {
          autoplay: 1,
          mute: 1,               // start muted: this part is never blocked
          start: START,
          controls: 1,
          rel: 0,
          playsinline: 1,
          modestbranding: 1,
          iv_load_policy: 3
        },
        events: {
          onReady: function (e) {
            e.target.playVideo();
            window.setTimeout(attemptUnmute, 400);
          },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.PLAYING) attemptUnmute();
          },
          onError: function () {
            /* 101/150 = the owner disabled embedding; offer the real link. */
            document.getElementById('fallback-msg').textContent =
              'This video does not allow embedding, so open it on YouTube.';
            fallback.hidden = false;
          }
        }
      });
    };

    /* Any gesture on the page lets the browser allow real volume. */
    function gesture() {
      if (!player) return;
      if (!unmuted || (player.isMuted && player.isMuted())) attemptUnmute();
      if (player.getPlayerState && player.getPlayerState() !== 1) {
        try { player.playVideo(); } catch (e) {}
      }
    }
    ['click', 'keydown', 'touchstart'].forEach(function (evt) {
      document.addEventListener(evt, gesture, { passive: true });
    });
    sound.addEventListener('click', gesture);

    /* If the IFrame API never arrives (blocked/strict privacy), offer a link. */
    window.setTimeout(function () {
      if (!player) fallback.hidden = false;
    }, 3500);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') window.location.href = 'index.html#terminal';
    });
  })();
  </script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
