<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Never gonna give you up</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: #000;
    color: #cfe6d6;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    overflow: hidden;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: .7rem 1rem;
    font-size: .72rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #4ade80;
    border-bottom: 1px solid #14311f;
    background: #050a06;
  }
  .top .dots { display: inline-flex; gap: .35rem; margin-right: .6rem; }
  .top .dots i { width: .55rem; height: .55rem; border-radius: 50%; display: block; }
  .top .dots i:nth-child(1) { background: #ff5f57; }
  .top .dots i:nth-child(2) { background: #febc2e; }
  .top .dots i:nth-child(3) { background: #28c840; }
  .top .path { color: #7f9c88; }

  .stage {
    display: grid;
    place-items: center;
    padding: 1rem;
    min-height: 0;
  }
  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: calc((100vh - 9rem) * 16 / 9);
    max-height: 100%;
    aspect-ratio: 16 / 9;
    background: #050a06;
    border: 1px solid #14311f;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(34, 197, 94, .16), inset 0 0 0 1px rgba(74, 222, 128, .06);
  }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .fallback {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: .75rem;
    text-align: center;
    padding: 2rem;
    color: #cfe6d6;
    font-size: .9rem;
    line-height: 1.7;
  }
  .fallback[hidden] { display: none; }
  .fallback a { color: #9dffc4; }

  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: .6rem 1rem;
    font-size: .72rem;
    color: #7f9c88;
    border-top: 1px solid #14311f;
    background: #050a06;
  }
  .bottom a { color: #9dffc4; text-decoration: none; }
  .bottom a:hover { text-decoration: underline; }
  .bottom kbd {
    background: #16241a;
    border: 1px solid #22c55e;
    border-radius: 5px;
    padding: .05rem .35rem;
    font: inherit;
    color: #9dffc4;
  }

  /* "tap for sound" nudge, only shown if the browser kept the player muted */
  .sound {
    position: fixed;
    left: 50%;
    bottom: 3.4rem;
    transform: translateX(-50%);
    margin: 0;
    padding: .6rem 1.1rem;
    border-radius: 999px;
    border: 1px solid #22c55e;
    background: rgba(5, 10, 6, .94);
    color: #9dffc4;
    font-size: .78rem;
    letter-spacing: .06em;
    cursor: pointer;
    box-shadow: 0 0 26px rgba(34, 197, 94, .3);
    animation: nudge 2.2s ease-in-out infinite;
  }
  .sound[hidden] { display: none; }
  @keyframes nudge {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-4px); }
  }
  @media (prefers-reduced-motion: reduce) { .sound { animation: none; } }
</style>
</head>
<body>
  <header class="top">
    <span>
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      joseph@portfolio: <span class="path" id="path">~/rickroll</span>
    </span>
    <span id="note">you were warned</span>
  </header>

  <main class="stage">
    <div class="frame">
      <div id="player"></div>
      <div class="fallback" id="fallback" hidden>
        <p>The embed was blocked, so autoplay can't start here.</p>
        <p><a id="yt-link" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">Open it on YouTube instead</a></p>
      </div>
    </div>
  </main>

  <footer class="bottom">
    <span><kbd>Esc</kbd> or the link to escape</span>
    <a href="index.html#terminal">&larr; back to the terminal</a>
  </footer>

  <p class="sound" id="sound" role="button" tabindex="0" hidden>tap anywhere for sound</p>

  <script>
  (function () {
    /* ?v=<video id>&name=<path label>&note=<top-right text>&title=<tab title> */
    var params = new URLSearchParams(window.location.search);
    var VIDEO = /^[A-Za-z0-9_-]{11}$/.test(params.get('v') || '') ? params.get('v') : 'dQw4w9WgXcQ';
    var NAME = (params.get('name') || 'rickroll').slice(0, 40);
    var NOTE = (params.get('note') || 'you were warned').slice(0, 40);
    var TITLE = (params.get('title') || 'Never gonna give you up').slice(0, 80);

    document.title = TITLE;
    document.getElementById('path').textContent = '~/' + NAME;
    document.getElementById('note').textContent = NOTE;
    document.getElementById('yt-link').href = 'https://www.youtube.com/watch?v=' + VIDEO;

    var player = null;
    var unmuted = false;
    var sound = document.getElementById('sound');
    var fallback = document.getElementById('fallback');
    var tries = 0;

    /* Muted autoplay is always allowed, so start there and try to unmute. */
    function attemptUnmute() {
      if (!player || typeof player.unMute !== 'function') return;
      try {
        player.setVolume(100);
        player.unMute();
      } catch (e) { /* older embed API */ }
      window.setTimeout(function () {
        var stillMuted = false;
        try { stillMuted = player.isMuted(); } catch (e) {}
        if (stillMuted && tries < 4) {
          tries += 1;
          sound.hidden = false;               // ask for the gesture the browser wants
        } else {
          unmuted = true;
          sound.hidden = true;
        }
      }, 300);
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        videoId: VIDEO,
        playerVars: {
          autoplay: 1,
          mute: 1,               // start muted: this part is never blocked
          controls: 1,
          rel: 0,
          playsinline: 1,
          modestbranding: 1,
          iv_load_policy: 3
        },
        events: {
          onReady: function (e) {
            e.target.playVideo();
            window.setTimeout(attemptUnmute, 400);
          },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.PLAYING) attemptUnmute();
          }
        }
      });
    };

    /* Any gesture on the page lets the browser allow real volume. */
    function gesture() {
      if (!player) return;
      if (!unmuted || (player.isMuted && player.isMuted())) attemptUnmute();
      if (player.getPlayerState && player.getPlayerState() !== 1) {
        try { player.playVideo(); } catch (e) {}
      }
    }
    ['click', 'keydown', 'touchstart'].forEach(function (evt) {
      document.addEventListener(evt, gesture, { passive: true });
    });
    sound.addEventListener('click', gesture);

    /* If the IFrame API never arrives (blocked/strict privacy), offer a link. */
    window.setTimeout(function () {
      if (!player) fallback.hidden = false;
    }, 3500);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') window.location.href = 'index.html#terminal';
    });
  })();
  </script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
