<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="siri-title siri-desc">
  <title id="siri-title">Siri of Omarchy offline voice pipeline</title>
  <desc id="siri-desc">Press Insert to record 16 kHz mono audio, transcribe it locally with whisper-cli, turn the intent into JSON with Ollama qwen2.5:3b, then act through hyprctl and reply out loud in a British female Piper voice.</desc>

  <rect width="1200" height="400" fill="#000000"/>

  <text x="48" y="46" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3">SIRI OF OMARCHY</text>
  <text x="48" y="84" fill="#ffffff" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="700">Push-to-talk, start to finish, on the laptop</text>

  <!-- Node 1: the key -->
  <g>
    <rect x="48" y="128" width="192" height="108" rx="14" fill="#0e130e" stroke="#1e2e22"/>
    <text x="68" y="162" fill="#e9f5ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600">Insert key</text>
    <text x="68" y="188" fill="#9db8a4" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="12.5">press to talk, press again</text>
    <text x="68" y="208" fill="#9db8a4" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="12.5">to send. One line of Lua.</text>
  </g>

  <g stroke="#22c55e" stroke-width="2" fill="none"><path d="M244 182h22"/></g>
  <path d="M276 182l-9 -5v10z" fill="#22c55e"/>

  <!-- Node 2: capture -->
  <g>
    <rect x="276" y="128" width="192" height="108" rx="14" fill="#0e130e" stroke="#1e2e22"/>
    <text x="296" y="162" fill="#e9f5ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600">pw-record</text>
    <text x="296" y="188" fill="#9db8a4" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="12.5">16 kHz mono capture</text>
    <text x="296" y="208" fill="#9db8a4" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="12.5">on PipeWire</text>
  </g>

  <g stroke="#22c55e" stroke-width="2" fill="none"><path d="M472 182h22"/></g>
  <path d="M504 182l-9 -5v10z" fill="#22c55e"/>

  <!-- Node 3: speech to text -->
  <g>
    <rect x="504" y="128" width="192" height="108" rx="14" fill="#0e130e" stroke="#1e2e22"/>
    <text x="524" y="162" fill="#e9f5ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600">whisper-cli</text>
    <text x="524" y="188" fill="#9db8a4" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="12.5">base.en (142 MB)</text>
    <text x="524" y="208" fill="#9db8a4" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="12.5">speech to text, offline</text>
  </g>

  <g stroke="#22c55e" stroke-width="2" fill="none"><path d="M700 182h22"/></g>
  <path d="M732 182l-9 -5v10z" fill="#22c55e"/>

  <!-- Node 4: intent -->
  <g>
    <rect x="732" y="128" width="192" height="108" rx="14" fill="#0e130e" stroke="#1e2e22"/>
    <text x="752" y="162" fill="#e9f5ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600">Ollama</text>
    <text x="752" y="188" fill="#9db8a4" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="12.5">qwen2.5:3b intent router</text>
    <text x="752" y="208" fill="#9db8a4" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="12.5">turns words into JSON</text>
  </g>

  <g stroke="#22c55e" stroke-width="2" fill="none"><path d="M928 182h22"/></g>
  <path d="M960 182l-9 -5v10z" fill="#22c55e"/>

  <!-- Node 5: action -->
  <g>
    <rect x="960" y="128" width="192" height="108" rx="14" fill="#0e130e" stroke="#22c55e"/>
    <text x="980" y="162" fill="#e9f5ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600">hyprctl + apps</text>
    <text x="980" y="188" fill="#9db8a4" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="12.5">apps, workspaces, windows</text>
    <text x="980" y="208" fill="#9db8a4" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="12.5">timers, weather, calendar</text>
  </g>

  <!-- Reply loop -->
  <path d="M1056 236v42H144v-34" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M144 236l-5 10h10z" fill="#16a34a"/>
  <text x="600" y="310" text-anchor="middle" fill="#9db8a4" font-family="ui-sans-serif, Segoe UI, system-ui, sans-serif" font-size="13">speaks the confirmation in a British female voice, with a popup</text>

  <text x="600" y="342" text-anchor="middle" fill="#9db8a4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">100% local · no audio leaves the machine · Hyprland 0.56</text>
</svg>
